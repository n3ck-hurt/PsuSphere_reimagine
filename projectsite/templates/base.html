{% load static %}
<!DOCTYPE html>
<html>
<head>
	<meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
	<title>{% block title %}PSUSphere{% endblock %}</title>
	<meta content='width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0, shrink-to-fit=no' name='viewport' />
	<link rel="stylesheet" href="{% static 'css/bootstrap.min.css' %}">
	<link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Nunito:200,200i,300,300i,400,400i,600,600i,700,700i,800,800i,900,900i">
	<link rel="stylesheet" href="{% static 'css/ready.css' %}">
	<link rel="stylesheet" href="{% static 'css/demo.css' %}">
</head>
<body>
	<div class="wrapper">
		<div class="main-header">
			<div class="logo-header">
				<a href="{% url 'home' %}" class="logo">
					PSUSphere
				</a>
				<button class="navbar-toggler sidenav-toggler ml-auto" type="button" data-toggle="collapse" data-target="collapse" aria-controls="sidebar" aria-expanded="false" aria-label="Toggle navigation">
					<span class="navbar-toggler-icon"></span>
				</button>
				<button class="topbar-toggler more"><i class="la la-ellipsis-v"></i></button>
			</div>
			<nav class="navbar navbar-header navbar-expand-lg">
				<div class="container-fluid">
					
					<form class="navbar-left navbar-form nav-search mr-md-3" action="">
						<div class="input-group">
							<input type="text" placeholder="Search ..." class="form-control" style="border-radius: 20px;">
						</div>
					</form>
					<ul class="navbar-nav topbar-nav ml-md-auto align-items-center">
						<li class="nav-item dropdown hidden-caret">
							<a class="nav-link dropdown-toggle" href="#" id="navbarDropdown" role="button" data-toggle="dropdown" aria-haspopup="true" aria-expanded="false">
								<i class="la la-envelope"></i>
							</a>
						</li>
						<li class="nav-item dropdown hidden-caret">
							<a class="nav-link dropdown-toggle" href="#" id="navbarDropdown" role="button" data-toggle="dropdown" aria-haspopup="true" aria-expanded="false">
								<i class="la la-bell"></i>
								<span class="notification">3</span>
							</a>
						</li>
						<li class="nav-item dropdown">
							<a class="dropdown-toggle profile-pic" data-toggle="dropdown" href="#" aria-expanded="false"> 
								<img src="{% static 'img/profile.jpg' %}" alt="user-img" width="36" class="img-circle">
								<span>Guest</span> 
							</a>
						</li>
                        <li class="nav-item">
                            <a href="#" class="nav-link">Login</a>
                        </li>
					</ul>
				</div>
			</nav>
		</div>
		<div class="sidebar">
			<div class="scrollbar-inner sidebar-wrapper">
				<div class="user">
					<div class="photo" style="background: #5867dd; color: #fff; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 18px; border-radius: 50%;">
						H
					</div>
					<div class="info">
						<a class="" data-toggle="collapse" href="#collapseExample" aria-expanded="true">
							<span>
								Not logged in
							</span>
						</a>
					</div>
				</div>
				<ul class="nav">
					<li class="nav-item {% if request.resolver_match.url_name == 'home' %}active{% endif %}">
						<a href="{% url 'home' %}">
							<i class="la la-home"></i>
							<p>Dashboard</p>
						</a>
					</li>
					<li class="nav-item {% if request.resolver_match.url_name == 'organization-list' %}active{% endif %}">
						<a href="{% url 'organization-list' %}">
							<i class="la la-sitemap"></i>
							<p>Organizations</p>
						</a>
					</li>
					<li class="nav-item {% if request.resolver_match.url_name == 'orgmember-list' %}active{% endif %}">
						<a href="{% url 'orgmember-list' %}">
							<i class="la la-users"></i>
							<p>Organization Members</p>
						</a>
					</li>
					<li class="nav-item {% if request.resolver_match.url_name == 'student-list' %}active{% endif %}">
						<a href="{% url 'student-list' %}">
							<i class="la la-graduation-cap"></i>
							<p>Students</p>
						</a>
					</li>
					<li class="nav-item {% if request.resolver_match.url_name == 'college-list' %}active{% endif %}">
						<a href="{% url 'college-list' %}">
							<i class="la la-building"></i>
							<p>Colleges</p>
						</a>
					</li>
					<li class="nav-item {% if request.resolver_match.url_name == 'program-list' %}active{% endif %}">
						<a href="{% url 'program-list' %}">
							<i class="la la-book"></i>
							<p>Programs</p>
						</a>
					</li>
				</ul>

			</div>
		</div>
		<div class="main-panel">
			{% block content %}
			{% endblock %}
		</div>
	</div>
</body>
<script src="{% static 'js/core/jquery.3.2.1.min.js' %}"></script>
<script src="{% static 'js/plugin/jquery-ui-1.12.1.custom/jquery-ui.min.js' %}"></script>
<script src="{% static 'js/core/popper.min.js' %}"></script>
<script src="{% static 'js/core/bootstrap.min.js' %}"></script>
<script src="{% static 'js/plugin/chartist/chartist.min.js' %}"></script>
<script src="{% static 'js/plugin/chartist/plugin/chartist-plugin-tooltip.min.js' %}"></script>
<script src="{% static 'js/plugin/bootstrap-notify/bootstrap-notify.min.js' %}"></script>
<script src="{% static 'js/plugin/bootstrap-toggle/bootstrap-toggle.min.js' %}"></script>
<script src="{% static 'js/plugin/jquery-mapael/jquery.mapael.min.js' %}"></script>
<script src="{% static 'js/plugin/jquery-mapael/maps/world_countries.min.js' %}"></script>
<script src="{% static 'js/plugin/chart-circle/circles.min.js' %}"></script>
<script src="{% static 'js/plugin/jquery-scrollbar/jquery.scrollbar.min.js' %}"></script>
<script src="{% static 'js/ready.min.js' %}"></script>
</html>
